security:
    password_hashers:
        App\Entity\AdminUser: 'auto'

    providers:
        app_admin_provider:
            entity:
                class: App\Entity\AdminUser
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build|css)($|/))
            security: false
        main:
            lazy: true
            provider: app_admin_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                username_parameter: _username
                password_parameter: _password
                csrf_parameter: _csrf_token
                csrf_token_id: authenticate
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/setup, roles: PUBLIC_ACCESS }
        - { path: ^/css, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            App\Entity\AdminUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
